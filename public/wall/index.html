<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230085ff'/%3E%3Cpath d='M16 7c-3 0-6 4-6 4v9a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-9s-3-4-6-4z' fill='white'/%3E%3C/svg%3E" />
<title>Bluesky Live Wall</title>
<link rel="stylesheet" href="/assets/wall/wall.css" />
</head>
<body>
  <div id="app">
    <header id="header">
      <div class="header-left">
        <h1 id="event-title">Bluesky Live Wall</h1>
        <p id="event-subtitle" class="subtitle"></p>
      </div>
      <div class="header-tags" id="hashtags" aria-label="監視中のハッシュタグ"></div>
      <div class="header-right">
        <div class="stat-block">
          <span class="stat-value" id="stat-displayed">0</span>
          <span class="stat-label">件の投稿</span>
        </div>
        <div class="status-block">
          <span id="status-dot" class="status-dot status-connecting" aria-hidden="true"></span>
          <span id="status-text">接続待ち</span>
        </div>
        <div class="clock" id="clock">--:--:--</div>
      </div>
    </header>

    <main id="wall" class="wall-grid" aria-live="polite" tabindex="0"></main>

    <button type="button" id="new-posts" class="new-posts" aria-live="polite">
      <span class="new-posts-arrow" aria-hidden="true">&#9650;</span>
      <span id="new-posts-count">0</span>
      <span>件の新着</span>
    </button>

    <section id="waiting-screen" class="waiting-screen">
      <p class="waiting-message">接続中……</p>
      <p class="waiting-hashtag" id="waiting-hashtag"></p>
      <p class="waiting-hint" id="waiting-hint"></p>
    </section>
  </div>

  <script src="/assets/wall/wall.js"></script>
</body>
</html>
