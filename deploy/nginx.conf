# nginx をリバースプロキシに使う場合の設定例。
# SSE のバッファリング無効化が最重要。これを忘れると投稿が数十秒遅れて
# まとめて届く、あるいは全く届かない。

upstream bsky_live_wall {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wall.example.com;

    ssl_certificate     /etc/letsencrypt/live/wall.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wall.example.com/privkey.pem;

    # SSE ストリーム
    location /api/stream {
        proxy_pass http://bsky_live_wall;
        proxy_http_version 1.1;

        # ここが要点。バッファリングと圧縮を止める。
        proxy_buffering off;
        proxy_cache off;
        gzip off;

        # ストリームは張りっぱなしになるため、読み取りタイムアウトを長く取る。
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 管理画面は運営拠点の IP に絞ることを推奨する。
    # location ~ ^/(admin|api/admin) {
    #     allow 203.0.113.0/24;
    #     deny all;
    #     proxy_pass http://bsky_live_wall;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    location / {
        proxy_pass http://bsky_live_wall;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name wall.example.com;
    return 301 https://$host$request_uri;
}
