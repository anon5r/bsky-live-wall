# リモートから利用する構成。
#
# 既定ではアプリだけを動かし、ホストの 127.0.0.1:3000 に出す。
# 前段のプロキシ (Cloudflare Tunnel や既存の nginx など) から叩く想定。
#
#   1. .env を用意する (ADMIN_TOKEN を必ず設定する)
#   2. docker compose up -d
#
# TLS 終端ごと任せたい場合 (VPS で単体運用するときなど) は Caddy を足す。
# 証明書は Let's Encrypt から自動取得する。
#
#   1. .env に WALL_DOMAIN を設定する
#   2. docker compose --profile caddy up -d
services:
  app:
    build: .
    image: bsky-live-wall:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # リバースプロキシ配下なので必須。
      # これがないと、プロキシ経由の全アクセスが loopback と誤認され
      # 管理 API を素通りさせてしまう。
      TRUST_PROXY: "true"
      HOST: "0.0.0.0"
      PORT: "3000"
    expose:
      - "3000"
    ports:
      # 前段のプロキシから叩くために出しておく。
      # 既定はホストの loopback のみ。別ホストの cloudflared などから
      # 届かせる場合は .env で BIND_ADDR=0.0.0.0 にする (経路の制限は
      # ファイアウォール側で行うこと)。
      - "${BIND_ADDR:-127.0.0.1}:${BIND_PORT:-3000}:3000"
    networks:
      - wall
    # 書けるのは /tmp と /app/data だけにする。
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # マルチテナントのテナント設定 (SQLite) と、会場モニターに出す画像。
      # 単一テナント運用では空のままだが、当てておいて困らない。
      - wall_data:/app/data
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # TLS 終端まで任せる場合だけ起動する:
  #   docker compose --profile caddy up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # 必須。未設定のまま caddy プロファイルを起動すると Caddy 側でエラーになる。
      # (compose はプロファイルに関係なく展開するため、ここでは必須指定にしない)
      WALL_DOMAIN: ${WALL_DOMAIN:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - wall

networks:
  wall:

volumes:
  wall_data:
  caddy_data:
  caddy_config:
