<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #3b82f6; }
    a:hover { color: #60a5fa; }
    .b-root {
      --bg: #14161a;
      --surface: #1d2026;
      --alt: #24272e;
      --border: #33363e;
      --text: #e7e9ee;
      --muted: #9298a4;
      --primary: #3b82f6;
      --radius: 8px;
      width: 880px;
      height: 640px;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    .b-head:hover { background: var(--alt); }
  </style>
</helmet>

<div class="b-root">
  <div style="padding: 16px 20px 10px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="display: inline-flex; align-items: center; justify-content: center; height: 20px; padding: 0 8px; border-radius: 4px; font-size: 11px; font-weight: 700; background: var(--alt); color: var(--muted);">Option B</span>
      <span style="font-size: 15px; font-weight: 700;">1 カラム / セクション折りたたみ</span>
    </div>
    <p style="margin: 6px 0 0; font-size: 12px; color: var(--muted); line-height: 1.7;">
      いまの縦積みを残したまま、4 つの見出しに畳む案。実装差分は小さいが、開くと結局スクロールが伸びる。
    </p>
  </div>

  <div style="padding: 6px 20px 20px; display: flex; flex-direction: column; gap: 8px;">

    <!-- ウォールバー (共通) -->
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border);">
      <span style="width: 88px; height: 10px; border-radius: 3px; background: var(--muted); opacity: 0.5;"></span>
      <span style="width: 52px; height: 10px; border-radius: 3px; background: var(--primary); opacity: 0.6;"></span>
      <span style="margin-left: auto; width: 120px; height: 10px; border-radius: 3px; background: var(--muted); opacity: 0.3;"></span>
    </div>

    <sc-for list="{{ sections }}" as="s" hint-placeholder-count="4">
      <div style="border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); overflow: hidden;">
        <div class="b-head" style="display: flex; align-items: center; gap: 10px; padding: 13px 14px; cursor: pointer;" onClick="{{ s.toggle }}">
          <span style="{{ s.caretStyle }}">▸</span>
          <span style="font-size: 14px; font-weight: 700;">{{ s.title }}</span>
          <span style="font-size: 12px; color: var(--muted);">{{ s.summary }}</span>
          <span style="margin-left: auto; font-size: 12px; color: var(--muted);">{{ s.count }}</span>
        </div>
        <sc-if value="{{ s.open }}" hint-placeholder-val="{{ true }}">
          <div style="padding: 4px 14px 14px; border-top: 1px solid var(--border);">
            <sc-for list="{{ s.rows }}" as="r" hint-placeholder-count="3">
              <div style="display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--border);">
                <span style="{{ r.labelStyle }}"></span>
                <span style="margin-left: auto; {{ r.ctlStyle }}"></span>
              </div>
            </sc-for>
          </div>
        </sc-if>
      </div>
    </sc-for>

    <div style="display: flex; align-items: center; gap: 8px; padding: 11px 14px; border-radius: var(--radius); border: 1px dashed var(--border); color: var(--muted); font-size: 12px;">
      承認待ち / 直近の投稿はこの下に続く（設定と運用が同じ列に混ざる）
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":880,"height":640}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: { moderation: true } };
  }

  row(width, ctl) {
    return {
      labelStyle: 'display: block; width: ' + width + 'px; height: 10px; border-radius: 3px; background: var(--muted); opacity: 0.45;',
      ctlStyle:
        'display: block; width: ' + ctl + 'px; height: 22px; border-radius: 6px; background: var(--alt); border: 1px solid var(--border);',
    };
  }

  renderVals() {
    const defs = [
      { id: 'terms', title: '監視語', summary: 'ハッシュタグ / キーワード', count: '8 件', rows: [this.row(120, 190), this.row(96, 190), this.row(140, 190)] },
      { id: 'moderation', title: '承認と除外', summary: '承認モード・除外キーワード', count: '公開', rows: [this.row(110, 210), this.row(170, 210), this.row(130, 150)] },
      { id: 'display', title: '会場モニター表示', summary: 'ヘッダ・時計', count: '4 項目', rows: [this.row(150, 46), this.row(170, 46), this.row(110, 46)] },
      { id: 'wall', title: 'ウォール管理', summary: '名前・削除', count: '', rows: [this.row(60, 240), this.row(90, 120)] },
    ];

    return {
      sections: defs.map((d) => {
        const open = !!this.state.open[d.id];
        return {
          title: d.title,
          summary: d.summary,
          count: d.count,
          rows: d.rows,
          open: open,
          caretStyle:
            'display: inline-block; width: 12px; font-size: 11px; color: var(--muted); transition: transform 0.12s ease;' +
            (open ? 'transform: rotate(90deg);' : ''),
          toggle: () => {
            const next = Object.assign({}, this.state.open);
            next[d.id] = !open;
            this.setState({ open: next });
          },
        };
      }),
    };
  }
}
</script>
</body>
</html>
